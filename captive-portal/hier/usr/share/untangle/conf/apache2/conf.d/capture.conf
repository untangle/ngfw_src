Alias /capture @PREFIX@/usr/share/untangle/web/capture

<Location /capture>
    Order Allow,Deny
    Allow from All
    Require all granted
    AddHandler mod_python .py
    PythonHandler mod_python.publisher
    PythonDebug Off
</Location>

<Location /capture/logout>
    DirectoryIndex logout.py
    Order Allow,Deny
    Allow from All
    Require all granted
    AddHandler mod_python .py
    PythonHandler mod_python.publisher
    PythonDebug Off
</Location>

# Do not expose custom-page directories left behind by older installations.
<LocationMatch "^/capture/custom_[^/]+(/|$)">
    Require all denied
</LocationMatch>
